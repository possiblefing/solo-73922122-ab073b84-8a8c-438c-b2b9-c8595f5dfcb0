<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遥测 SQL 涉敏血缘核查</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --line: #d9dee4; --text: #1f2733;
    --ok: #137a3f; --ok-bg: #e6f6ec; --bad: #b3261e; --bad-bg: #fdeceb;
    --warn: #9a6200; --warn-bg: #fff4e0; --info: #0b5cad; --info-bg: #e8f1fb;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { background: #16283f; color: #fff; padding: 12px 20px; display: flex;
           align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px;
           font-weight: 600; }
  .b-version { background: #2c4a73; color: #cfe1ff; }
  .b-pass { background: var(--ok-bg); color: var(--ok); }
  .b-blocked { background: var(--bad-bg); color: var(--bad); }
  .b-error { background: var(--warn-bg); color: var(--warn); }
  .b-none { background: #e2e6ea; color: #5a6672; }
  main { max-width: 1180px; margin: 18px auto; padding: 0 16px 40px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  section h2 { margin: 0 0 10px; font-size: 15px; }
  .hint { color: #5a6672; font-size: 12.5px; margin: 4px 0 10px; }
  .banner { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; display: none; }
  .banner.show { display: block; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #ecd9ae; }
  table.cat { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
  table.cat th, table.cat td { border: 1px solid var(--line); padding: 4px 6px; font-size: 13px; }
  table.cat th { background: #f0f3f6; text-align: left; }
  input[type=text] { font-family: var(--mono); font-size: 13px; padding: 3px 6px;
                     border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  textarea { width: 100%; min-height: 180px; font-family: var(--mono); font-size: 13px;
             padding: 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: #fff; cursor: pointer; }
  button:hover { background: #f0f3f6; }
  button.primary { background: var(--info); border-color: var(--info); color: #fff; }
  button.primary:hover { background: #0a4f94; }
  button.dirty { outline: 2px solid var(--warn); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .tname { width: 180px; }
  .cname { width: 220px; }
  .del { color: var(--bad); border: none; background: none; padding: 2px 6px; }
  .small { font-size: 12px; padding: 3px 8px; }
  .colcard { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .colcard.sensitive { border-color: #e5b4b0; background: #fffafa; }
  .colhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .colname { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .colexpr { font-family: var(--mono); color: #5a6672; font-size: 12px; }
  table.src { border-collapse: collapse; width: 100%; margin-top: 8px; }
  table.src th, table.src td { border: 1px solid var(--line); padding: 3px 8px; font-size: 12.5px; }
  table.src th { background: #f0f3f6; }
  .via { display: inline-block; background: var(--info-bg); color: var(--info); border-radius: 8px;
         padding: 1px 8px; font-size: 11.5px; margin: 1px 2px; }
  .tag-sens { background: var(--bad-bg); color: var(--bad); border-radius: 8px;
              padding: 1px 8px; font-size: 11.5px; font-weight: 700; }
  .tag-ok { background: var(--ok-bg); color: var(--ok); border-radius: 8px;
            padding: 1px 8px; font-size: 11.5px; }
  .mono { font-family: var(--mono); }
  .errlist { background: var(--warn-bg); border: 1px solid #ecd9ae; border-radius: 6px;
             padding: 8px 12px; font-size: 13px; }
  .stale { opacity: .45; }
  .statusline { font-size: 12.5px; color: #5a6672; }
</style>
</head>
<body>
<header>
  <h1>遥测 SQL 涉敏血缘核查</h1>
  <span class="badge b-version" id="versionBadge">版本 v-</span>
  <span class="badge b-none" id="analysisBadge">未核查</span>
  <span class="statusline" id="pollStatus"></span>
</header>
<main>
  <div class="banner warn" id="staleBanner"></div>

  <section>
    <h2>① 字段目录（至多 4 张表，勾选涉敏字段）</h2>
    <div class="hint">表名 / 列名仅支持字母、数字、下划线；名称匹配不区分大小写。涉敏字段如精确位置（precise_lat / precise_lng）、手机号等。</div>
    <div id="catalogEditor"></div>
    <div class="btnrow">
      <button type="button" class="small" id="addTableBtn">+ 添加表</button>
      <button type="button" class="small" id="loadDemoCatalogBtn">载入示例目录</button>
    </div>
  </section>

  <section>
    <h2>② 待外发 SQL（单条 SELECT）</h2>
    <div class="hint">支持：非递归 CTE、别名、星号（* / t.*）、JOIN … ON、WHERE、GROUP BY、HAVING、聚合、UNION ALL。聚合不视为脱敏。保存 / 核查 / 下载等待期间仍可编辑；任何本地改动都会立即使旧结论失效。</div>
    <textarea id="sqlEditor" spellcheck="false" placeholder="SELECT ..."></textarea>
    <div class="btnrow">
      <button type="button" class="small" id="loadDemoPassBtn">示例（可通过）</button>
      <button type="button" class="small" id="loadDemoBlockedBtn">示例（涉敏被拦）</button>
      <button type="button" id="saveBtn">保存输入</button>
      <button type="button" class="primary" id="analyzeBtn">核查</button>
      <button type="button" id="downloadBtn">下载 SQL</button>
      <button type="button" id="syncBtn">刷新为当前输入</button>
      <span class="statusline" id="actionStatus"></span>
    </div>
  </section>

  <section id="resultSection" style="display:none">
    <h2>③ 核查结论 <span class="statusline" id="resultMeta"></span></h2>
    <div id="resultBody"></div>
  </section>
</main>

<script type="module" src="/static/app/app.js"></script>
</body>
</html>
